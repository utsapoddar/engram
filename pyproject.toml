[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.0"
description = "Durable, auditable memory for AI coding agents"
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
semantic = ["fastembed==0.8.0"]

[project.scripts]
engram = "engram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
